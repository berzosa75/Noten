<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
<title>Musik Partituren</title>
<style>
  :root {
    --accent: #3d5a73;
    --accent-light: #e2eaf0;
    --border: #c7d4dd;
    --bg: #f6f9fb;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
  body {
    font-family: "Segoe UI", Arial, sans-serif;
    background: var(--bg);
    margin: 0;
    padding: 0 0 60px 0;
    color: #2a2a2a;
  }
  header {
    background: var(--accent);
    color: #fff;
    padding: 16px 20px 14px;
    position: sticky;
    top: 0;
    z-index: 10;
    box-shadow: 0 2px 6px rgba(0,0,0,0.25);
  }
  header h1 { margin: 0 0 10px; font-size: 1.3em; font-weight: 600; }
  #searchBox {
    width: 100%; max-width: 480px; padding: 11px 14px; border-radius: 6px;
    border: none; font-size: 16px;
  }
  #alphaNav {
    display: flex; flex-wrap: nowrap; overflow-x: auto; gap: 2px;
    margin-top: 10px; padding-bottom: 2px;
  }
  #alphaNav::-webkit-scrollbar { height: 4px; }
  .alpha-btn {
    flex: 0 0 auto; min-width: 26px; text-align: center; padding: 4px 6px;
    border-radius: 4px; font-size: .82em; font-weight: 600; color: #fff;
    background: rgba(255,255,255,.15); cursor: pointer; border: none;
    font-family: inherit;
  }
  .alpha-btn:hover { background: rgba(255,255,255,.32); }
  .alpha-btn.disabled {
    color: rgba(255,255,255,.35); background: transparent;
    cursor: default; pointer-events: none;
  }
  #stats { color: #e7eef3; font-size: .8em; margin-top: 7px; }
  #instrumentFilters {
    display: flex; gap: 8px; overflow-x: auto; margin-top: 10px; padding: 1px 0 2px;
  }
  .instrument-btn {
    display: inline-flex; align-items: center; gap: 6px; flex: 0 0 auto;
    border: 1px solid rgba(255,255,255,.35); border-radius: 999px;
    background: rgba(255,255,255,.09); color: #fff; padding: 7px 11px;
    font: inherit; font-size: .88em; cursor: pointer;
  }
  .instrument-btn:hover { background: rgba(255,255,255,.18); }
  .instrument-btn.active {
    color: var(--accent); background: #fff; border-color: #fff; font-weight: 650;
  }
  .instrument-icon { font-size: 1.15em; line-height: 1; }
  main { max-width: 900px; margin: 20px auto; padding: 0 14px; }
  .composer { margin-bottom: 24px; scroll-margin-top: 205px; }
  .composer-name {
    font-size: 1.2em; font-weight: 700; color: var(--accent);
    border-bottom: 2px solid var(--accent); padding-bottom: 4px; margin-bottom: 10px;
  }
  .book {
    background: #fff; border: 1px solid var(--border); border-radius: 8px;
    margin-bottom: 8px; overflow: hidden;
  }
  .book-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 14px; min-height: 44px; cursor: pointer; user-select: none;
  }
  .book-header:hover, .book-header:active { background: var(--accent-light); }
  .book-header.static { cursor: default; }
  .book-header.static:hover { background: inherit; }
  .book-title-block { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .book-title { font-weight: 600; font-size: 1em; word-break: break-word; }
  .book-verlag { font-size: .82em; color: #777; font-style: italic; word-break: break-word; }
  .toggle-icon {
    font-size: 1.1em; color: var(--accent); transition: transform .2s ease;
    margin-left: 10px; flex-shrink: 0; width: 24px; height: 24px;
    display: flex; align-items: center; justify-content: center;
  }
  .book.open .toggle-icon { transform: rotate(90deg); }
  .werke-list {
    display: none; list-style: none; margin: 0; padding: 4px 14px 12px 22px;
    border-top: 1px solid var(--border);
  }
  .book.open .werke-list { display: block; }
  .werke-list li { padding: 6px 0; font-size: .95em; border-bottom: 1px dashed #eee; word-break: break-word; }
  .werke-list li:last-child { border-bottom: none; }
  mark { background: #ffe08a; padding: 0 1px; border-radius: 2px; }
  #noResults { text-align: center; color: #999; margin-top: 40px; display: none; }
  @media (max-width: 600px) {
    header { padding: 13px 12px; }
    header h1 { font-size: 1.1em; margin-bottom: 9px; }
    #searchBox { padding: 10px 12px; }
    main { margin: 14px auto; padding: 0 10px; }
    .composer { scroll-margin-top: 215px; }
    .composer-name { font-size: 1.1em; }
    .book-header { padding: 11px 12px; }
    .book-title { font-size: .97em; }
    .book-verlag { font-size: .78em; }
    .werke-list { padding: 4px 10px 10px 18px; }
    .instrument-btn { padding: 7px 10px; }
  }
</style>
</head>

  <div id="stats" aria-live="polite"></div>
  <nav id="instrumentFilters" aria-label="Nach Instrument filtern"></nav>
</header>
<main id="main"></main>

const ALPHABET = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');
const mainEl = document.getElementById('main');
const searchBox = document.getElementById('searchBox');
const statsEl = document.getElementById('stats');
const noResultsEl = document.getElementById('noResults');
const alphaNavEl = document.getElementById('alphaNav');
const filtersEl = document.getElementById('instrumentFilters');
let activeCategory = 'all';

function escapeHtml(value) {
  return String(value || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function firstLetter(name) {
  const normalized = String(name || '').normalize('NFKD').replace(/[\u0300-\u036f]/g, '');
  const letter = normalized.trim().charAt(0).toUpperCase();
  return /[A-Z]/.test(letter) ? letter : '#';
}
function activeBooks() {
  return CATEGORIES
    .filter(category => activeCategory === 'all' || category.id === activeCategory)
    .flatMap(category => category.books);
}
function groupedBooks() {
  const groups = new Map();
  activeBooks().forEach(book => {
    if (!groups.has(book.komponist)) groups.set(book.komponist, []);
    groups.get(book.komponist).push(book);
  });
  return Array.from(groups, ([komponist, books]) => ({
    komponist,
    books: books.sort((a,b) => a.werk.localeCompare(b.werk, 'de', {sensitivity:'base'}))
  })).sort((a,b) => a.komponist.localeCompare(b.komponist, 'de', {sensitivity:'base'}));
}
function buildFilters() {
  const buttons = [{id:'all', name:'Alle', icon:'🎼'}, ...CATEGORIES];
  filtersEl.innerHTML = buttons.map(item => `
    <button type="button" class="instrument-btn${item.id === activeCategory ? ' active' : ''}"
      data-category="${escapeHtml(item.id)}" aria-pressed="${item.id === activeCategory}">
      <span class="instrument-icon" aria-hidden="true">${escapeHtml(item.icon)}</span>
      <span>${escapeHtml(item.name)}</span>
    </button>`).join('');
  filtersEl.querySelectorAll('.instrument-btn').forEach(button => {
    button.addEventListener('click', () => {
      activeCategory = button.dataset.category;
      buildFilters();
      buildAlphaNav();
      render(searchBox.value);
      window.scrollTo({top: 0, behavior: 'smooth'});
    });
  });
}
function buildAlphaNav() {
  const available = new Set(groupedBooks().map(group => firstLetter(group.komponist)));
  alphaNavEl.innerHTML = ALPHABET.map(letter => available.has(letter)
    ? `<button type="button" class="alpha-btn" data-letter="${letter}">${letter}</button>`
    : `<span class="alpha-btn disabled">${letter}</span>`).join('');
  alphaNavEl.querySelectorAll('button').forEach(button => {
    button.addEventListener('click', () => jumpToLetter(button.dataset.letter));
  });
}
function jumpToLetter(letter) {
  if (searchBox.value) {
    searchBox.value = '';
    render('');
  }
  const target = mainEl.querySelector(`.composer[data-letter="${letter}"]`);
  if (target) target.scrollIntoView({behavior:'smooth', block:'start'});
}
function highlight(text, term) {
  const safe = escapeHtml(text);
  if (!term) return safe;
  const index = safe.toLocaleLowerCase('de').indexOf(term.toLocaleLowerCase('de'));
  return index < 0 ? safe : safe.slice(0,index) + '<mark>' + safe.slice(index,index+term.length) + '</mark>' + safe.slice(index+term.length);
}
function render(filterTerm='') {
  mainEl.innerHTML = '';
  const term = filterTerm.trim();
  let visibleComposers = 0;
  let visibleBooks = 0;
  let visibleWorks = 0;
  groupedBooks().forEach(composer => {
    const composerMatches = composer.komponist.toLocaleLowerCase('de').includes(term.toLocaleLowerCase('de'));
    const bookBlocks = [];
    composer.books.forEach(book => {
      const normalizedTerm = term.toLocaleLowerCase('de');
      const bookMatches = book.werk.toLocaleLowerCase('de').includes(normalizedTerm) || book.verlag.toLocaleLowerCase('de').includes(normalizedTerm);
      const matchingWorks = term ? book.werke.filter(work => work.toLocaleLowerCase('de').includes(normalizedTerm)) : [];
      if (term && !composerMatches && !bookMatches && matchingWorks.length === 0) return;
      visibleBooks += 1;
      visibleWorks += book.werke.length;
      const expand = Boolean(term && matchingWorks.length && !composerMatches && !bookMatches);
      const single = book.werke.length <= 1;
      if (single) {
        const work = book.werke[0] || '';
        bookBlocks.push(`<div class="book"><div class="book-header static"><div class="book-title-block">
          <span class="book-title">${highlight(book.werk,term)}${work && work !== book.werk ? ' — ' + highlight(work,term) : ''}</span>
          <span class="book-verlag">${highlight(book.verlag,term)}</span>
        </div></div></div>`);
      } else {
        const items = book.werke.map(work => `<li>${highlight(work,term)}</li>`).join('');
        bookBlocks.push(`<div class="book${expand ? ' open' : ''}">
          <div class="book-header"><div class="book-title-block">
            <span class="book-title">${highlight(book.werk,term)} <span style="font-weight:400;color:#999;">(${book.werke.length} Werke)</span></span>
            <span class="book-verlag">${highlight(book.verlag,term)}</span>
          </div><span class="toggle-icon">▶</span></div><ul class="werke-list">${items}</ul></div>`);
      }
    });
    if (!bookBlocks.length) return;
    visibleComposers += 1;
    const section = document.createElement('section');
    section.className = 'composer';
    section.dataset.letter = firstLetter(composer.komponist);
    section.innerHTML = `<div class="composer-name">${highlight(composer.komponist,term)}</div>` + bookBlocks.join('');
    section.querySelectorAll('.book-header:not(.static)').forEach(header => {
      header.addEventListener('click', () => header.parentElement.classList.toggle('open'));
    });
    mainEl.appendChild(section);
  });
  noResultsEl.style.display = visibleComposers ? 'none' : 'block';
  statsEl.textContent = term
    ? `${visibleComposers} Komponisten · ${visibleBooks} Bücher/Ausgaben · ${visibleWorks} Werke (Filter: "${filterTerm}")`
    : `${visibleComposers} Komponisten · ${visibleBooks} Bücher/Ausgaben · ${visibleWorks} Werke`;
}
searchBox.addEventListener('input', event => render(event.target.value));
buildFilters();
buildAlphaNav();
render();
</script>
